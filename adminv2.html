<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIP Admin Console</title>
<!-- SIP Admin Console v1: read-only fleet monitor for every provisioned device. Separate page,
     separate login, from the customer-facing indexv4.html - see "Admin Console" in the
     SIP Controller - Multi-Tenant Setup project doc for how to create an admin account.
     Requires firebase-rules-v5.json to be published (adds the /admins-gated blanket read on
     /devices and /deviceOwners that this page depends on). -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-dark: #071118; --card-bg: #0d1c26; --card-border: #1c3444;
    --primary: #2cb5e8; --primary-glow: rgba(44, 181, 232, 0.35);
    --fert-color: #3ecf7a; --danger: #f0564e; --warning: #f2b23e;
    --text-main: #eef7fb; --text-muted: #8aa5b2;
    --border-radius: 16px; --shadow: 0 18px 45px rgba(2, 8, 14, 0.55);
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
}
* { box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main);
    margin: 0; padding: 0; min-height: 100vh;
    background-image:
        radial-gradient(900px 500px at 85% -10%, rgba(44,181,232,0.14), transparent 60%),
        radial-gradient(700px 450px at -10% 30%, rgba(240,86,78,0.06), transparent 60%);
    background-attachment: fixed;
}
button, input { font-family: inherit; }

#login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
.login-card {
    background: linear-gradient(165deg, rgba(23,44,58,0.85), rgba(10,22,30,0.95));
    border: 1px solid var(--card-border); padding: 44px 32px; border-radius: 22px;
    width: 90%; max-width: 370px; box-shadow: var(--shadow); text-align: center;
}
.login-card i.top-icon { font-size: 42px; color: var(--warning); margin-bottom: 16px; }
.login-card h2 { margin: 0 0 6px 0; font-size: 22px; font-weight: 700; font-family: var(--font-display); }
.login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 26px; }
.login-card input { font-size: 15px; font-weight: 600; padding: 14px 16px; background: rgba(2,10,16,0.55); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 14px; }
.login-card input:focus { border-color: var(--warning); outline: none; }
.btn-login { background: linear-gradient(135deg, #f2b23e, #c98a1f); color: #1a1200; border: none; padding: 16px; width: 100%; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
#login-error { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 15px; display: none; }

#admin-app { display: none; padding-bottom: 60px; }
.header { background: rgba(7, 17, 24, 0.85); backdrop-filter: blur(16px); padding: 16px 22px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(242,178,62,0.18); }
.brand-title { display: flex; align-items: center; gap: 11px; font-size: 18px; font-weight: 700; font-family: var(--font-display); }
.brand-title i { color: var(--warning); }
.header-right { display: flex; align-items: center; gap: 14px; }
.device-count { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); background: rgba(13,28,38,0.8); padding: 7px 13px; border-radius: 10px; border: 1px solid var(--card-border); }
.btn-logout { background: transparent; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
.btn-logout:hover { color: var(--danger); }

.container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
.section-title { font-size: 13px; font-weight: 700; margin: 0 0 15px 5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
.device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.empty-state { text-align: center; color: var(--text-muted); padding: 60px 20px; font-family: var(--font-mono); }

.dev-card {
    background: linear-gradient(170deg, rgba(18,36,48,0.7), rgba(10,21,29,0.94));
    border: 1px solid var(--card-border); border-radius: var(--border-radius); padding: 18px;
    box-shadow: var(--shadow);
}
.dev-card.problem { border-color: var(--danger); box-shadow: 0 0 24px rgba(240,86,78,0.18), var(--shadow); }
.dev-card.paused { border-color: var(--warning); box-shadow: 0 0 24px rgba(242,178,62,0.15), var(--shadow); }
.dev-card.offline { opacity: 0.55; }

.dev-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.dev-id { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
.dev-owner { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.status-pill { font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.pill-online { background: rgba(62,207,122,0.12); color: var(--fert-color); border: 1px solid rgba(62,207,122,0.4); }
.pill-offline { background: rgba(138,165,178,0.1); color: var(--text-muted); border: 1px solid var(--card-border); }
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.alert-banner { background: rgba(240,86,78,0.1); border: 1px solid rgba(240,86,78,0.4); color: #ff9b95; font-size: 12px; font-weight: 700; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
.alert-banner.warn { background: rgba(242,178,62,0.1); border-color: rgba(242,178,62,0.4); color: var(--warning); }

.dev-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.dev-row:last-child { border-bottom: none; }
.dev-row .label { color: var(--text-muted); font-weight: 600; }
.dev-row .val { font-family: var(--font-mono); font-weight: 700; }
.val-on { color: var(--primary); }
.val-fert-on { color: var(--fert-color); }
.val-err { color: var(--danger); }

.dev-footer { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <i class="fa-solid fa-user-shield top-icon"></i>
        <h2>SIP Admin Console</h2>
        <p>Fleet monitoring. Admin accounts only.</p>
        <input type="email" id="login-email" placeholder="Admin Email">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="btn-login" onclick="loginAdmin()"><i class="fa-solid fa-lock-open"></i> Access Console</button>
        <div id="login-error"></div>
    </div>
</div>

<div id="admin-app">
    <div class="header">
        <div class="brand-title"><i class="fa-solid fa-user-shield"></i> SIP-ADMIN</div>
        <div class="header-right">
            <div class="device-count" id="fw-target-display" style="display:none;" title="Latest firmware published under /firmwareUpdate"><i class="fa-solid fa-cloud-arrow-up"></i> v<span id="fw-target-version">--</span> · <span id="fw-updated-count">0</span>/<span id="fw-total-count">0</span> updated</div>
            <div class="device-count"><span id="device-count">0</span> devices</div>
            <button class="btn-logout" onclick="logoutAdmin()" title="Logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
    </div>
    <div class="container">
        <div class="section-title">All Connected Devices</div>
        <div id="device-grid" class="device-grid"></div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB3d2TB8bKWys4KBQY5YXFFazah_hfr0JQ",
  authDomain: "customer-base-de561.firebaseapp.com",
  databaseURL: "https://customer-base-de561-default-rtdb.firebaseio.com",
  projectId: "customer-base-de561",
  storageBucket: "customer-base-de561.firebasestorage.app",
  messagingSenderId: "792957370683",
  appId: "1:792957370683:web:f2e711e262e58c5e56b71e",
  measurementId: "G-71MRTH8R5J"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.database();

const loginScreen = document.getElementById('login-screen');
const adminApp = document.getElementById('admin-app');
const loginError = document.getElementById('login-error');

let allDevices = {};
let allOwners = {};
let targetFwVersion = null; // v2: latest version published under /firmwareUpdate/version
let renderInterval = null;

auth.onAuthStateChanged((user) => {
    if (user) { checkIsAdmin(user); }
    else {
        loginScreen.style.display = 'flex'; adminApp.style.display = 'none';
        if (renderInterval) { clearInterval(renderInterval); renderInterval = null; }
    }
});

function checkIsAdmin(user) {
    // /admins itself is unreadable by clients (locked in the Security Rules), so we can't
    // read it directly to check membership - instead we just attempt the read this page
    // actually needs (/devices) and let the rules themselves be the judge. If this account
    // isn't listed in /admins, this read is denied and .catch() below fires.
    db.ref('devices').once('value').then(() => {
        loginScreen.style.display = 'none'; adminApp.style.display = 'block';
        startMonitoring();
    }).catch((err) => {
        loginError.innerText = "This account is not set up as an admin. Add its UID under /admins in the database first.";
        loginError.style.display = 'block';
        auth.signOut();
    });
}

function loginAdmin() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    loginError.style.display = 'none';
    if (!email || !pass) { loginError.innerText = "Please enter email and password."; loginError.style.display = 'block'; return; }
    auth.signInWithEmailAndPassword(email, pass).catch((error) => {
        loginError.innerText = "Invalid credentials.";
        loginError.style.display = 'block';
    });
}
function logoutAdmin() { auth.signOut(); }

const interlockDesc = {
    1: "VOLTAGE OUT OF BOUNDS", 2: "DRY RUN DETECTED", 3: "OVERLOAD DETECTED",
    4: "SENSOR FAULT (PZEM)", 5: "METER OFFLINE (Modbus)", 6: "PHASE LOSS"
};
const tripDesc = {
    0: "MANUAL EMERGENCY STOP", 1: "VOLTAGE FAULT", 2: "DRY RUN (retries exhausted)",
    3: "OVERLOAD (retries exhausted)", 4: "SENSOR FAULT"
};

function startMonitoring() {
    db.ref('devices').on('value', (snap) => { allDevices = snap.val() || {}; });
    db.ref('deviceOwners').on('value', (snap) => { allOwners = snap.val() || {}; });
    // v2: track the fleet-wide target firmware version published from the Firebase Console,
    // so the header can show rollout progress (X/Y devices updated) at a glance.
    db.ref('firmwareUpdate/version').on('value', (snap) => { targetFwVersion = snap.val() || null; });
    renderInterval = setInterval(renderDevices, 1000);
    renderDevices();
}

function timeAgo(unixSec) {
    if (!unixSec) return "never";
    let diff = Math.floor(Date.now() / 1000) - unixSec;
    if (diff < 60) return diff + "s ago";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
}

function renderDevices() {
    const grid = document.getElementById('device-grid');
    const nowSec = Math.floor(Date.now() / 1000);
    const ids = Object.keys(allDevices);
    document.getElementById('device-count').innerText = ids.length;

    if (ids.length === 0) {
        grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-microchip" style="font-size:28px; opacity:0.4; margin-bottom:10px; display:block;"></i>No devices found under /devices yet.</div>';
        return;
    }

    // Sort problem devices first (emergency/interlock), then offline, then normal - so anything
    // that needs attention is always at the top instead of buried alphabetically by MAC.
    const rows = ids.map(id => {
        const d = allDevices[id] || {};
        const sys = d.system || {};
        const isOnline = (nowSec - (sys.heartbeat || 0)) < 25;
        const isEmergency = sys.emergencyStop === true;
        const interlockCode = sys.interlockReason || 0;
        const rolledBack = (sys.otaStatus || '').startsWith('rolled_back');
        let priority = 3; // 0=emergency, 1=interlock/paused/rolled-back-update, 2=offline, 3=normal
        if (isEmergency) priority = 0;
        else if (interlockCode > 0 || rolledBack) priority = 1;
        else if (!isOnline) priority = 2;
        return { id, d, sys, isOnline, isEmergency, interlockCode, priority };
    }).sort((a, b) => a.priority - b.priority || a.id.localeCompare(b.id));

    grid.innerHTML = rows.map(r => renderCard(r, nowSec)).join('');

    // v2: fleet-wide OTA rollout progress badge
    const fwBadge = document.getElementById('fw-target-display');
    if (targetFwVersion) {
        const updatedCount = rows.filter(r => r.sys.fwVersion === targetFwVersion).length;
        document.getElementById('fw-target-version').innerText = targetFwVersion;
        document.getElementById('fw-updated-count').innerText = updatedCount;
        document.getElementById('fw-total-count').innerText = rows.length;
        fwBadge.style.display = 'flex';
    } else {
        fwBadge.style.display = 'none';
    }
}

function renderCard(r, nowSec) {
    const { id, sys, isOnline, isEmergency, interlockCode } = r;
    let cardClass = "dev-card";
    if (isEmergency) cardClass += " problem";
    else if (interlockCode > 0) cardClass += " paused";
    else if (!isOnline) cardClass += " offline";

    const owners = allOwners[id] || {};
    const ownerVal = Object.values(owners)[0]; // value is either `true` (legacy) or the customer's email
    const ownerLabel = ownerVal && ownerVal !== true ? ownerVal : (Object.keys(owners).length ? "linked (no email on file)" : "UNASSIGNED");

    let banner = '';
    if (isEmergency) {
        const reason = tripDesc[sys.lastTripReason] || "UNKNOWN FAULT";
        banner = `<div class="alert-banner"><i class="fa-solid fa-triangle-exclamation"></i> EMERGENCY STOP - ${reason}</div>`;
    } else if (interlockCode > 0) {
        banner = `<div class="alert-banner warn"><i class="fa-solid fa-pause"></i> PAUSED - ${interlockDesc[interlockCode] || "Interlock active"}</div>`;
    }

    const activeIrr = sys.activeIrrZone || 0;
    const activeFert = sys.activeFertZone || 0;
    const manIrr = sys.manualIrrZone || 0;
    const manFert = sys.manualFertZone || 0;
    const zoneDisplay = activeIrr > 0 ? activeIrr : (manIrr > 0 ? manIrr : 0);
    const fertDisplay = activeFert > 0 ? activeFert : (manFert > 0 ? manFert : 0);

    const voltVal = (sys.voltage === undefined || sys.voltage < 0) ? '<span class="val val-err">ERR</span>' : `<span class="val">${parseFloat(sys.voltage).toFixed(1)} V</span>`;
    const currVal = (sys.voltage === undefined || sys.voltage < 0) ? '<span class="val val-err">--</span>' : `<span class="val">${parseFloat(sys.current || 0).toFixed(2)} A</span>`;

    // v2: firmware version + rollout status, compared against /firmwareUpdate/version
    const fwVer = sys.fwVersion || null;
    const isOutdated = targetFwVersion && fwVer && fwVer !== targetFwVersion;
    const otaBusy = sys.otaStatus === 'downloading' || sys.otaStatus === 'checking';
    let fwLine;
    if (!fwVer) fwLine = 'unknown (pre-v5 build)';
    else if (otaBusy) fwLine = `v${fwVer} <span style="color:var(--warning);">· ${sys.otaStatus}...</span>`;
    else if (isOutdated) fwLine = `v${fwVer} <span style="color:var(--warning);">· update pending</span>`;
    else fwLine = `v${fwVer}`;
    if (sys.otaStatus && sys.otaStatus.startsWith('failed')) fwLine = `v${fwVer || '?'} <span style="color:var(--danger);">· ${sys.otaStatus}</span>`;
    if (sys.otaStatus && sys.otaStatus.startsWith('rolled_back')) fwLine = `v${fwVer || '?'} <span style="color:var(--danger);">· AUTO-REVERTED - update failed</span>`;

    return `
    <div class="${cardClass}">
        <div class="dev-header">
            <div>
                <div class="dev-id"><i class="fa-solid fa-microchip"></i> ${id}</div>
                <div class="dev-owner">${ownerLabel}</div>
            </div>
            <div class="status-pill ${isOnline ? 'pill-online' : 'pill-offline'}"><span class="pill-dot"></span> ${isOnline ? 'ONLINE' : 'OFFLINE'}</div>
        </div>
        ${banner}
        <div class="dev-row"><span class="label">Main Pump</span><span class="val ${sys.pump1Active ? 'val-on' : ''}">${sys.pump1Active ? 'ON' : 'OFF'}</span></div>
        <div class="dev-row"><span class="label">Fert Pump</span><span class="val ${sys.fertPumpActive ? 'val-fert-on' : ''}">${sys.fertPumpActive ? 'ON' : 'OFF'}</span></div>
        <div class="dev-row"><span class="label">Active Zone / Comp</span><span class="val">${zoneDisplay > 0 ? 'Zone ' + zoneDisplay : '-'}${fertDisplay > 0 ? ' / Comp ' + fertDisplay : ''}${zoneDisplay === 0 && fertDisplay === 0 ? 'Standby' : ''}</span></div>
        <div class="dev-row"><span class="label">Backwash</span><span class="val ${sys.isBackwashActive ? 'val-on' : ''}">${sys.isBackwashActive ? 'ACTIVE' : 'Off'}</span></div>
        <div class="dev-row"><span class="label">Voltage</span>${voltVal}</div>
        <div class="dev-row"><span class="label">Current</span>${currVal}</div>
        <div class="dev-row"><span class="label">WiFi Signal</span><span class="val">${sys.rssi ? sys.rssi + ' dBm' : '--'}</span></div>
        <div class="dev-row"><span class="label">Firmware</span><span class="val">${fwLine}</span></div>
        <div class="dev-footer">Last seen: ${timeAgo(sys.heartbeat)}</div>
    </div>`;
}
</script>
</body>
</html>
